<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Su-Founder OS Router 运行图</title>
  <desc id="desc">从真实问题开始，识别层级、读取依据、组合判断、给出下一步，并选择性沉淀。</desc>

  <defs>
    <pattern id="watermark" width="620" height="220" patternUnits="userSpaceOnUse" patternTransform="rotate(-16)">
      <text x="24" y="118" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" letter-spacing="2" fill="#0F172A" opacity="0.045">SU-FOUNDER OS · PUBLIC REFERENCE · CC BY-NC-SA 4.0</text>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <rect width="1600" height="900" fill="url(#watermark)"/>

  <text x="88" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#3B82F6" letter-spacing="1.5">SU-FOUNDER OS / PUBLIC REFERENCE</text>
  <text x="88" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="48" font-weight="700" fill="#101828">先解决当前问题，再决定什么值得留下</text>
  <text x="88" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" fill="#667085">Router 只读取最少但足够的材料，不把每一次对话都变成长期资产。</text>

  <line x1="292" y1="420" x2="342" y2="420" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="532" y1="420" x2="582" y2="420" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="772" y1="420" x2="822" y2="420" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1012" y1="420" x2="1062" y2="420" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1252" y1="420" x2="1302" y2="420" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" filter="url(#shadow)">
    <g>
      <rect x="82" y="318" width="210" height="204" rx="18" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
      <text x="108" y="354" font-size="18" fill="#98A2B3">01</text>
      <text x="108" y="402" font-size="28" font-weight="700" fill="#101828">真实问题</text>
      <text x="108" y="446" font-size="18" fill="#667085">从一个需要判断的</text>
      <text x="108" y="476" font-size="18" fill="#667085">现实问题开始</text>
    </g>

    <g>
      <rect x="322" y="318" width="210" height="204" rx="18" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
      <text x="348" y="354" font-size="18" fill="#98A2B3">02</text>
      <text x="348" y="402" font-size="28" font-weight="700" fill="#101828">识别层级</text>
      <text x="348" y="446" font-size="18" fill="#667085">产品、用户、商业</text>
      <text x="348" y="476" font-size="18" fill="#667085">或重要取舍</text>
    </g>

    <g>
      <rect x="562" y="318" width="210" height="204" rx="18" fill="#EEF5FF" stroke="#3B82F6" stroke-width="3"/>
      <text x="588" y="354" font-size="18" fill="#3B82F6">03</text>
      <text x="588" y="402" font-size="28" font-weight="700" fill="#101828">读取依据</text>
      <text x="588" y="446" font-size="18" fill="#667085">原则、历史决定</text>
      <text x="588" y="476" font-size="18" fill="#667085">与真实证据</text>
    </g>

    <g>
      <rect x="802" y="318" width="210" height="204" rx="18" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
      <text x="828" y="354" font-size="18" fill="#98A2B3">04</text>
      <text x="828" y="402" font-size="28" font-weight="700" fill="#101828">组合判断</text>
      <text x="828" y="446" font-size="18" fill="#667085">结合当下约束</text>
      <text x="828" y="476" font-size="18" fill="#667085">说明依据与取舍</text>
    </g>

    <g>
      <rect x="1042" y="318" width="210" height="204" rx="18" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
      <text x="1068" y="354" font-size="18" fill="#98A2B3">05</text>
      <text x="1068" y="402" font-size="28" font-weight="700" fill="#101828">给出下一步</text>
      <text x="1068" y="446" font-size="18" fill="#667085">谁执行、验证什么</text>
      <text x="1068" y="476" font-size="18" fill="#667085">结果回到哪里</text>
    </g>

    <g>
      <rect x="1282" y="318" width="236" height="204" rx="18" fill="#EEF5FF" stroke="#3B82F6" stroke-width="3"/>
      <text x="1308" y="354" font-size="18" fill="#3B82F6">06</text>
      <text x="1308" y="402" font-size="28" font-weight="700" fill="#101828">选择性沉淀</text>
      <text x="1308" y="446" font-size="18" fill="#667085">只有形成长期价值</text>
      <text x="1308" y="476" font-size="18" fill="#667085">才进入系统</text>
    </g>
  </g>

  <rect x="244" y="614" width="1112" height="118" rx="18" fill="#EEF5FF" stroke="#D7E8FF" stroke-width="2"/>
  <text x="800" y="660" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700" fill="#101828">长期资产门槛</text>
  <text x="800" y="704" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#3B82F6">跨场景重复 · 影响重要边界 · 有真实证据 · 能阻止旧错误</text>

  <text x="88" y="836" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#667085">公开参考版仅展示结构与方法，不包含个人经历、真实项目和历史决定。</text>
  <text x="1512" y="836" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#667085">© 2026 SU · CC BY-NC-SA 4.0</text>
</svg>
